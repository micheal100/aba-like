[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aba-like"
version = "0.1.0"
description = "Customer-owned NOR-based anomaly detection POC for SWOSH (not a reimplementation of SolarWinds ABA)"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "tabulate>=0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
aba-like = "aba_like.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
